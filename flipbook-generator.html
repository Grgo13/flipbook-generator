<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動画 ➔ パラパラ漫画風GIF変換ツール</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-zinc-800 selection:text-zinc-100">

  <main class="w-full max-w-lg bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl space-y-6">
    
    <!-- ヘッダー -->
    <header class="text-center space-y-1">
      <h1 class="text-2xl font-semibold tracking-tight text-zinc-100">パラパラ漫画風GIFジェネレーター</h1>
      <p class="text-xs text-zinc-400">撮影した動画をスケッチ・アニメ調のパラパラ漫画GIFに変換します</p>
    </header>

    <!-- ファイル選択エリア -->
    <section 
      id="drop-zone" 
      class="border-2 border-dashed border-zinc-700 hover:border-zinc-400 bg-zinc-900/50 hover:bg-zinc-800/50 transition-all rounded-xl p-6 text-center cursor-pointer flex flex-col items-center justify-center space-y-2"
    >
      <svg class="w-8 h-8 text-zinc-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2 2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
      </svg>
      <div class="pointer-events-none">
        <p class="text-xs font-medium text-zinc-300">動画ファイルを選択・ドロップ (MP4/MOV)</p>
      </div>
      <input type="file" id="file-input" accept="video/*" class="hidden" />
    </section>

    <!-- 設定パネル -->
    <section id="settings-section" class="hidden space-y-4 border-t border-zinc-800 pt-4">
      <video id="video-element" class="hidden" playsinline muted></video>
      <canvas id="work-canvas" class="hidden"></canvas>

      <div class="space-y-1.5">
        <label for="filter-style" class="block text-xs font-medium text-zinc-300">アートスタイル</label>
        <select id="filter-style" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-200 text-xs rounded-lg p-2.5 focus:outline-none focus:border-zinc-500">
          <option value="none" selected>フィルターなし (カクカクコマ落としのみ)</option>
          <option value="sketch">モノクロスケッチ (手書き風)</option>
          <option value="poster">ポスタリゼーション (レトロアニメ風)</option>
        </select>
      </div>

      <div class="space-y-1.5">
        <label for="size-select" class="block text-xs font-medium text-zinc-300">出力サイズ</label>
        <select id="size-select" class="w-full bg-zinc-950 border border-zinc-800 text-zinc-200 text-xs rounded-lg p-2.5 focus:outline-none focus:border-zinc-500">
          <option value="400">標準 (横幅 400px - 処理が早い)</option>
          <option value="600">大きめ (横幅 600px)</option>
          <option value="800">特大 (横幅 800px - ※処理に少し時間がかかります)</option>
        </select>
      </div>

      <div class="space-y-1">
        <div class="flex justify-between text-xs">
          <span class="text-zinc-300">パラパラ感 (1秒あたりのコマ数)</span>
          <span id="fps-label" class="font-mono text-zinc-400">6 コマ/秒</span>
        </div>
        <input type="range" id="fps-slider" min="3" max="12" value="6" class="w-full h-1.5 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-zinc-100">
      </div>

      <button 
        id="convert-btn" 
        class="w-full py-3 bg-zinc-100 hover:bg-white text-zinc-900 font-semibold text-xs rounded-xl shadow transition-colors cursor-pointer"
      >
        パラパラ漫画GIFを生成する
      </button>
    </section>

    <!-- プログレス表示 -->
    <section id="progress-section" class="hidden space-y-2 border-t border-zinc-800 pt-4">
      <div class="flex justify-between text-xs">
        <span id="status-text" class="text-zinc-400">コマを切り出し中...</span>
        <span id="progress-percent" class="font-mono text-zinc-200">0%</span>
      </div>
      <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-zinc-100 h-2 rounded-full w-0 transition-all duration-200"></div>
      </div>
    </section>

    <!-- 出力表示 -->
    <section id="result-section" class="hidden space-y-4 border-t border-zinc-800 pt-4">
      <div class="text-xs text-center font-medium text-zinc-300">✓ 生成が完了しました</div>
      <div class="flex justify-center bg-black border border-zinc-800 rounded-xl p-2 min-h-[200px] items-center overflow-hidden">
        <img id="result-gif" class="w-full h-auto max-h-[600px] rounded-lg object-contain" alt="生成されたGIF">
      </div>
      <a 
        id="download-btn" 
        download="flipbook.gif" 
        class="block w-full py-3 bg-zinc-100 hover:bg-white text-zinc-900 font-semibold text-center text-xs rounded-xl shadow transition-colors cursor-pointer"
      >
        GIFアニメをダウンロード
      </a>
    </section>

    <footer class="border-t border-zinc-800 pt-4 text-center">
      <a href="./index.html" class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors font-mono">← Dashboard に戻る</a>
    </footer>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const settingsSection = document.getElementById('settings-section');
    const videoEl = document.getElementById('video-element');
    const canvas = document.getElementById('work-canvas');
    const ctx = canvas.getContext('2d');

    const filterStyle = document.getElementById('filter-style');
    const sizeSelect = document.getElementById('size-select');
    const fpsSlider = document.getElementById('fps-slider');
    const fpsLabel = document.getElementById('fps-label');
    const convertBtn = document.getElementById('convert-btn');

    const progressSection = document.getElementById('progress-section');
    const statusText = document.getElementById('status-text');
    const progressPercent = document.getElementById('progress-percent');
    const progressBar = document.getElementById('progress-bar');

    const resultSection = document.getElementById('result-section');
    const resultGif = document.getElementById('result-gif');
    const downloadBtn = document.getElementById('download-btn');

    let selectedFile = null;

    fpsSlider.addEventListener('input', (e) => {
      fpsLabel.textContent = `${e.target.value} コマ/秒`;
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    dropZone.addEventListener('dragover', () => dropZone.classList.add('border-zinc-400', 'bg-zinc-800/80'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-zinc-400', 'bg-zinc-800/80'));

    dropZone.addEventListener('drop', (e) => {
      dropZone.classList.remove('border-zinc-400', 'bg-zinc-800/80');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFileSelect(e.target.files[0]);
      }
    });

    function handleFileSelect(file) {
      if (!file.type.startsWith('video/')) {
        alert('動画ファイルを選択してください。');
        return;
      }
      selectedFile = file;
      videoEl.src = URL.createObjectURL(selectedFile);
      
      settingsSection.classList.remove('hidden');
      resultSection.classList.add('hidden');
      progressSection.classList.add('hidden');
    }

    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      convertBtn.disabled = true;
      convertBtn.classList.add('opacity-50', 'cursor-not-allowed');
      progressSection.classList.remove('hidden');
      resultSection.classList.add('hidden');
      progressBar.style.width = '0%';
      progressPercent.textContent = '0%';

      try {
        // 【スマホ対応ハック1】メディアロックの解除
        // ユーザーがボタンを押したこの瞬間に、再生アクションを起こしてロックを外す
        try {
          await videoEl.play();
          videoEl.pause();
        } catch (e) {
          console.warn("メディアの自動再生ロック解除をスキップしました");
        }

        // スマホ用に少し深い読み込み状態(HAVE_CURRENT_DATA以上)を待つ
        if (videoEl.readyState < 2) {
          await new Promise(resolve => {
            videoEl.addEventListener('loadeddata', resolve, { once: true });
          });
        }

        const duration = Math.min(videoEl.duration, 10);
        const fps = parseInt(fpsSlider.value);
        const totalFrames = Math.floor(duration * fps);
        const interval = 1 / fps;

        const targetWidth = parseInt(sizeSelect.value);
        const targetHeight = Math.round((videoEl.videoHeight / videoEl.videoWidth) * targetWidth);
        canvas.width = targetWidth;
        canvas.height = targetHeight;

        const workerBlob = new Blob(
          ["importScripts('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');"],
          { type: 'application/javascript' }
        );
        const workerUrl = URL.createObjectURL(workerBlob);

        const gif = new GIF({
          workers: 2,
          quality: 10,
          width: targetWidth,
          height: targetHeight,
          workerScript: workerUrl
        });

        statusText.textContent = 'フレームを抽出・加工中...';

        for (let i = 0; i < totalFrames; i++) {
          const targetTime = i * interval;
          
          await new Promise(resolve => {
            if (videoEl.currentTime === targetTime) {
              resolve();
            } else {
              // 【スマホ対応ハック2】無限フリーズ防止のタイムアウト
              // 800ミリ秒待ってもシークが終わらなければ強制的に次へ進める
              const failSafe = setTimeout(resolve, 800); 
              
              videoEl.addEventListener('seeked', () => {
                clearTimeout(failSafe);
                resolve();
              }, { once: true });
              
              videoEl.currentTime = targetTime;
            }
          });

          ctx.drawImage(videoEl, 0, 0, targetWidth, targetHeight);
          applyFilter(ctx, targetWidth, targetHeight, filterStyle.value);
          gif.addFrame(ctx, { copy: true, delay: Math.round(1000 / fps) });

          const p = Math.round(((i + 1) / totalFrames) * 50);
          progressPercent.textContent = `${p}%`;
          progressBar.style.width = `${p}%`;
        }

        statusText.textContent = 'GIFアニメを出力中... (大きなサイズだと数秒かかります)';

        gif.on('progress', function(p) {
          const percent = 50 + Math.round(p * 50);
          progressPercent.textContent = `${percent}%`;
          progressBar.style.width = `${percent}%`;
        });

        gif.on('finished', function(blob) {
          const url = URL.createObjectURL(blob);
          resultGif.src = url;
          downloadBtn.href = url;

          resultSection.classList.remove('hidden');
          progressSection.classList.add('hidden');
          
          convertBtn.disabled = false;
          convertBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          URL.revokeObjectURL(workerUrl);
        });

        gif.render();
      } catch (error) {
        console.error(error);
        alert('処理中にエラーが発生しました。');
        convertBtn.disabled = false;
        convertBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    });

    function applyFilter(ctx, width, height, type) {
      if (type === 'none') return;

      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      if (type === 'sketch') {
        for (let i = 0; i < data.length; i += 4) {
          const v = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
          const bw = v > 110 ? 255 : (v < 60 ? 20 : 120);
          data[i] = bw;
          data[i+1] = bw;
          data[i+2] = bw;
        }
      } else if (type === 'poster') {
        const levels = 4;
        const step = 255 / (levels - 1);
        for (let i = 0; i < data.length; i += 4) {
          data[i] = Math.round(data[i] / step) * step;
          data[i+1] = Math.round(data[i+1] / step) * step;
          data[i+2] = Math.round(data[i+2] / step) * step;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }
  </script>
</body>
</html>
